<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AetherLogix Orchestrator - Inventory & Logistics Telemetry</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-dim": "#0f131c",
            "primary": "#8ed5ff",
            "primary-container": "#38bdf8",
            "on-primary-container": "#004965",
            "surface-container": "#1c2028",
            "surface-container-high": "#262a33",
            "surface-container-low": "#181c24",
            "surface-container-lowest": "#0a0e16",
            "secondary": "#4edea3",
            "tertiary": "#ffbcbf",
            "error": "#ffb4ab",
            "on-surface": "#dfe2ee",
            "on-surface-variant": "#bdc8d1",
            "outline": "#87929a",
            "outline-variant": "#3e484f"
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f17;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(78, 222, 163, 0.03) 0%, transparent 45%);
      color: #dfe2ee;
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .critical-pulse-glow {
      box-shadow: 0 0 24px -4px rgba(244, 63, 94, 0.3);
    }
    .automation-glow {
      box-shadow: 0 0 20px -2px rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body class="bg-[#0b0f17] text-on-surface antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
